<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="app">
        <div class="conteudo-principal">
            <header class="topbar">
                <!--perfil e notificacao-->
                <div class="perfil">
                    <div class="avatar">TF</div>
                    <div class="texto-perfil">
                        <strong>InvestView</strong>
                        <p>Olá, Tiago Farias</p>
                    </div>
                </div>

                <button type="button" class="btn-notificacao" aria-label="notificacoes">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
            </header>

            <main>
                <!--cartao de saldo e carteira-->
                <section class="cartap-saldo">
                        <div class="cartao-topo">
                            <span>Patrimônio Total</span>
                            <button type="button" aria-label="visibilidade">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>

                        <p class="valor">R$ 22.500,00</p>

                        <span class="badge">↗ + 3% este mês</span>
                </section>
            </div>
            </main>
        </div>

        <nav class="menu">
            <!--aportar , resgatar, extrato-->
        </nav>
    </div>
</body>

</html>
