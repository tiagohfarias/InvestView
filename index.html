<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestView</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="app">
        <div class="conteudo-principal">
            <header class="topbar">
                <!--perfil e notificacao-->
                <div class="perfil">
                    <div class="avatar">TF</div>
                    <div class="texto-perfil">
                        <strong>InvestView</strong>
                        <p>Olá, Tiago Farias</p>
                    </div>
                </div>

                <button type="button" class="btn-notificacao" aria-label="notificacoes">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
            </header>

            <main>
                <!--cartao de saldo e carteira-->
                <section class="cartao-saldo">
                        <div class="cartao-topo">
                            <span>Patrimônio Total</span>
                            <button type="button" aria-label="visibilidade">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>

                        <p class="valor">R$ 22.500,00</p>

                        <span class="badge">↗ + 3% este mês</span>
                </section>
                <section class="minha-carteira">
                    <div class="carteira-topo">
                        <h2>Minha Carteira</h2>
                        <a href="#">Ver tudo</a>
                    </div>

                    <ul class="lista-investimentos">
                        <li class="item-investimentos">
                            <div class="item-icone" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z"/>
                                </svg>
                            </div>
                            <div class="item-info">
                                <strong>Renda Fixa</strong>
                                <p>CDB e Tesouro Direto</p>
                            </div>
                            <div class="item-valores">
                                <strong>R$ 13.500,00</strong>
                                <span class="positivo">+ 1.2%</span>
                            </div>
                        </li>

                        <li class="item-investimentos">
                            <div class="item-icone" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="20" x2="18" y2="10"/>
                                    <line x1="12" y1="20" x2="12" y2="4"/>
                                    <line x1="6" y1="20" x2="6" y2="14"/>
                                </svg>
                            </div>
                            <div class="item-info">
                                <strong>Renda Variável</strong>
                                <p>Ações e Fiis</p>
                            </div>
                            <div class="item-valores">
                                <strong>R$ 9.000,00</strong>
                                <span class="positivo"> + 4.8%</span>
                            </div>
                        </li>
                    </ul>
                </section>
            </main>
        </div>

        <nav class="menu">
            <!--aportar , resgatar, extrato-->
            <ul>
                <li>
                    <button type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>Aportar</span>
                    </button>
                </li>
                <li>
                    <button type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                        <span>Resgatar</span>
                    </button>
                </li>
                <li>
                    <button type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        <span>Extrato</span>
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</body>

</html>
